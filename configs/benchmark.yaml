# Shortest audited histories AND forecast horizons; spatial graphs where audited.
# Historical stage1 settings are preserved in benchmark_stage1.yaml and the running snapshot.
defaults:
  device: cuda
  epochs: 30
  patience: 5
  batch_size: 2
  accumulation: 4
  lr: 0.0001
  weight_decay: 0.0001
  graph_k: 8
  amp: true
  workers: 0
  loss: mae
  selection_scale: standardized
  selection_metric: mae
  train_ratio: 0.7
  val_ratio: 0.1
# Current execution is restricted to one seed by user request; defer 43/44.
seeds: [42]
datasets:
  metr_la:
    domain: traffic
    data: data/processed/metr_la.npz
    context: 12
    graph:
      kind: road_distance
      path: data/graphs/protocol-v2/metr_la.npz
    horizons: [1]
  pems_bay:
    domain: traffic
    data: data/processed/pems_bay.npz
    context: 12
    graph:
      kind: road_distance
      path: data/graphs/protocol-v2/pems_bay.npz
    horizons: [1]
  aqi:
    domain: environment
    data: data/processed/aqi.npz
    context: 24
    graph:
      kind: geographic_distance
      path: data/graphs/protocol-v2/aqi.npz
    horizons: [3]
  aqi_36:
    domain: environment
    data: data/processed/aqi_36.npz
    context: 12
    graph:
      kind: geographic_distance
      path: data/graphs/protocol-v2/aqi_36.npz
    horizons: [12]
  electricity:
    domain: energy
    data: data/processed/electricity.npz
    context: 8
    graph:
      kind: correlation
    horizons: [1]
  solar:
    domain: energy
    data: data/processed/solar.npz
    context: 24
    graph:
      kind: correlation
    horizons: [3]
models:
  persistence:
    family: persistence
  t5:
    family: encoder
    backbone: google-t5/t5-small
    revision: df1b051c49625cf57a3d0d8d3863ed4d13564fe4
    graph_layers: []
    freeze_backbone: true
  gofa_t5:
    family: encoder
    backbone: google-t5/t5-small
    revision: df1b051c49625cf57a3d0d8d3863ed4d13564fe4
    graph_layers: [1, 3]
    freeze_backbone: true
  chronos:
    family: encoder
    backbone: amazon/chronos-t5-small
    revision: a971ba21945c4f1796b17a91fe69214b5f4ad472
    graph_layers: []
    freeze_backbone: true
  gofa_chronos:
    family: encoder
    backbone: amazon/chronos-t5-small
    revision: a971ba21945c4f1796b17a91fe69214b5f4ad472
    graph_layers: [1, 3]
    freeze_backbone: true
  dst_sgnn:
    family: dst_sgnn
    root: external/dst_sgnn
    width: 64
    hidden_size: 1024
    spectral_precision: float64
# Official model is matched separately to EACH graph backbone, within 10% total params.
parameter_matching:
  references: [gofa_t5, gofa_chronos]
  basis: total
  tolerance: 0.10
  widths: [16, 32, 64, 96, 128, 192, 256, 384, 512, 768, 1024]
  hidden_sizes: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 40960, 65536]
