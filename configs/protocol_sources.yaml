protocol: v3_paired_lengths
date: '2026-10-14'
history_rule: Minimum verified forecasting history among the audited sources, at the dataset's sampling rate.
horizon_rule: Use the forecast length paired with the selected minimum-history task in the same source; do not minimize the forecast length independently.
note: Keep the previously selected history sources, including ties. Not an exhaustive literature minimum or a reproduction of each source's splits and preprocessing.
datasets:
  metr_la:
    context: 12
    horizon: 12
    horizon_source: https://github.com/liyaguang/DCRNN/blob/master/data/model/dcrnn_la.yaml
    horizon_evidence: The selected official METR-LA configuration pairs model.seq_len=12 with model.horizon=12.
    frequency: 5min
    source: https://github.com/liyaguang/DCRNN/blob/master/data/model/dcrnn_la.yaml
    evidence: model.seq_len=12, model.horizon=12
    graph_kind: road_distance
  pems_bay:
    context: 12
    horizon: 3
    horizon_source: https://github.com/microsoft/StemGNN#training-and-evaluation
    horizon_evidence: Official configuration Table 1, PEMS-BAY row pairs window_size=12 with horizon=3.
    frequency: 5min
    source: https://github.com/microsoft/StemGNN#training-and-evaluation
    evidence: Official configuration Table 1, PEMS-BAY window_size=12, horizon=3
    graph_kind: road_distance
  aqi:
    context: 24
    horizon: 6
    horizon_source: https://proceedings.mlr.press/v235/marisca24a.html
    horizon_evidence: Appendix Table 3 pairs Window=24 with Horizon=6 for AQI, 437 stations at hourly sampling.
    frequency: 1h
    source: https://proceedings.mlr.press/v235/marisca24a.html
    evidence: Appendix Table 3, AQI 437 stations, 8760 hourly steps, Window=24, Horizon=6
    graph_kind: geographic_distance
  aqi_36:
    context: 12
    horizon: 12
    horizon_source: https://arxiv.org/pdf/2302.09746
    horizon_evidence: PriSTI Section IV-C downstream forecasting pairs the past 12 steps with the next 12 steps on AQI-36.
    frequency: 1h
    source: https://arxiv.org/pdf/2302.09746
    evidence: Section IV-C downstream forecasting, past 12 steps predict next 12 steps on AQI-36
    note: Use the forecasting experiment, not the 36-step imputation window. We retain natural missing masks.
    graph_kind: geographic_distance
  electricity:
    context: 8
    horizon: 8
    horizon_source: https://arxiv.org/pdf/2405.05959
    horizon_evidence: TSDE deterministic Electricity benchmark, Appendix D.3.2 and Table 13 pair history=8 with prediction=8.
    frequency: 1h
    source: https://arxiv.org/pdf/2405.05959
    evidence: Deterministic Electricity benchmark, Section 4.1.3 and Appendix D.3.2/Table 13 include 8-8
    note: TimesNet-prepared hourly Electricity benchmark; we retain the 8-8 task, without claiming identical data hashes, preprocessing or splits.
    graph_kind: correlation
  solar:
    context: 24
    horizon: 3
    horizon_source: https://papers.nips.cc/paper_files/paper/2020/file/cdf6581cb7aca4b7e19ef136c6e601a5-Supplemental.pdf
    horizon_evidence: StemGNN Appendix D; 137 Alabama stations, 10-minute sampling; predicts the next 0.5 hour (3 contiguous steps).
    frequency: 10min
    source: https://papers.nips.cc/paper_files/paper/2020/file/cdf6581cb7aca4b7e19ef136c6e601a5-Supplemental.pdf
    evidence: Appendix D, 4-hour history at 10-minute sampling, predicting 0.5 hour, 137 Alabama stations
    note: No verified shorter same-frequency source in this audit; do not substitute an hourly Solar benchmark.
    graph_kind: correlation
