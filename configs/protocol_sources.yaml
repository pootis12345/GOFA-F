protocol: v3_lengths
date: '2026-10-14'
history_rule: Minimum verified forecasting history among the audited sources, at the dataset's sampling rate.
horizon_rule: Minimum verified contiguous forecast length among audited sources; not imputation, denoising steps, or a lone output at a later lead time.
note: Not a claim to have exhausted all published work. Published horizons/splits may differ from our protocol.
datasets:
  metr_la:
    context: 12
    horizon: 1
    horizon_source: https://eprints.bournemouth.ac.uk/37825/1/Zheng23-HybridModelsCompare%20%28Accepted%20version%29.pdf
    horizon_evidence: Hybrid Deep Learning Models for Traffic Prediction in Transportation Systems; Sections 2.2 and 7 compare T-prime=1,3,6,9,12 on METR-LA and PeMS-BAY at 5-minute sampling.
    frequency: 5min
    source: https://github.com/liyaguang/DCRNN/blob/master/data/model/dcrnn_la.yaml
    evidence: model.seq_len=12, model.horizon=12
    graph_kind: road_distance
  pems_bay:
    context: 12
    horizon: 1
    horizon_source: https://eprints.bournemouth.ac.uk/37825/1/Zheng23-HybridModelsCompare%20%28Accepted%20version%29.pdf
    horizon_evidence: Sections 2.2 and 7; 325 sensors, 5-minute sampling; explicit next-step forecast at T-prime=1.
    frequency: 5min
    source: https://github.com/microsoft/StemGNN#training-and-evaluation
    evidence: Official configuration table, PEMS-BAY window_size=12
    graph_kind: road_distance
  aqi:
    context: 24
    horizon: 3
    horizon_source: https://andreacini.github.io/assets/pdf/phd_thesis.pdf
    horizon_evidence: Andrea Cini, Graph Deep Learning for Time Series Forecasting, 2024, Section 4.1.1, printed page 40; AQI has 437 hourly PM2.5 stations and W=24,H=3.
    frequency: 1h
    source: https://proceedings.mlr.press/v235/marisca24a.html
    evidence: Appendix Table 3, AQI 437 stations, 8760 hourly steps, Window=24, Horizon=6
    graph_kind: geographic_distance
  aqi_36:
    context: 12
    horizon: 12
    horizon_source: https://arxiv.org/pdf/2302.09746
    horizon_evidence: PriSTI Section IV-C, past 12 steps predict next 12 steps; no shorter forecasting experiment verified for the same 36-station hourly dataset.
    frequency: 1h
    source: https://arxiv.org/pdf/2302.09746
    evidence: Section IV-C downstream forecasting, past 12 steps predict next 12 steps on AQI-36
    note: Use the forecasting experiment, not the 36-step imputation window. We retain natural missing masks.
    graph_kind: geographic_distance
  electricity:
    context: 8
    horizon: 1
    horizon_source: https://arxiv.org/html/2411.07413v2
    horizon_evidence: ODEStream, TMLR 03/2025, Algorithm 1 outputs y[j+1]; Sections 5.1-5.2 evaluate ECL with 321 clients in a one-step streaming setting.
    horizon_note: This supports a one-step task, not adoption of the paper's online test-time updating; our hourly prepared data and fixed offline splits remain separately identified.
    frequency: 1h
    source: https://arxiv.org/pdf/2405.05959
    evidence: Deterministic Electricity benchmark, Section 4.2 and Appendix D.3/Table 13 include 8-8
    note: TimesNet-prepared hourly Electricity benchmark; this supports history=8, not a claim of identical data hashes or splits. Our retained forecast lengths differ.
    graph_kind: correlation
  solar:
    context: 24
    horizon: 3
    horizon_source: https://papers.nips.cc/paper_files/paper/2020/file/cdf6581cb7aca4b7e19ef136c6e601a5-Supplemental.pdf
    horizon_evidence: StemGNN Appendix D; 137 Alabama stations, 10-minute sampling; predicts the next 0.5 hour (3 contiguous steps).
    frequency: 10min
    source: https://papers.nips.cc/paper_files/paper/2020/file/cdf6581cb7aca4b7e19ef136c6e601a5-Supplemental.pdf
    evidence: Appendix D, 4-hour history at 10-minute sampling, predicting 0.5 hour, 137 Alabama stations
    note: No verified shorter same-frequency source in this audit; do not substitute an hourly Solar benchmark.
    graph_kind: correlation
