[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gofa-f"
version = "0.1.0"
description = "Interleaved graph and pretrained language encoders for time-series forecasting"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<2.7", "transformers==4.46.3", "numpy>=1.26,<2",
  "pandas>=2.1,<3", "PyYAML>=6,<7", "sentencepiece>=0.2,<0.3",
  "scipy>=1.11,<2", "safetensors>=0.4", "huggingface-hub>=0.26,<1",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.11.13"]
data = ["tables>=3.9", "openpyxl>=3.1"]

[project.scripts]
gofa-train = "gofa_f.train:main"
gofa-prepare = "gofa_f.prepare:main"
gofa-benchmark = "gofa_f.benchmark:main"
gofa-report = "gofa_f.report:main"
gofa-progress = "gofa_f.progress:main"
gofa-tune = "gofa_f.tune:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
